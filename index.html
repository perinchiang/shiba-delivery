<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3e6c8">
  <link rel="icon" href="data:,">
  <title>阿柴快送</title>
  <style>
    html,body { margin:0; height:100%; background:#f4ead4; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:#362d26; }
    #loading { position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:24px; background:#f4ead4; }
    .loading-card { width:min(320px,86vw); padding:22px 24px 20px; border-radius:22px; background:#fffaf0; border:3px solid #473a30; box-shadow:0 10px 28px rgba(71,58,48,.14); text-align:center; }
    .loading-badge { font-size:32px; line-height:1; margin-bottom:6px; }
    .loading-title { display:block; font-size:20px; letter-spacing:.04em; color:#362d26; }
    #loading-text { margin:6px 0 14px; font-size:13px; color:#6c5d4c; }
    .loading-bar { height:10px; border-radius:999px; background:#eadec5; overflow:hidden; border:1.5px solid #473a30; }
    #loading-fill { display:block; width:6%; height:100%; background:#f7c52a; border-radius:999px; transition:width .2s ease; }
    #loading[data-error="1"] .loading-bar { display:none; }
  </style>
</head>
<body>
  <main id="game" aria-label="阿柴快送">
    <div id="stage" aria-label="游戏画面"></div>
    <div id="hud" hidden>
      <div id="street-controls">
        <details id="scene-debug" hidden>
          <summary>场景瞬移</summary>
          <span id="scene-perf">正在采样…</span>
          <div role="group" aria-label="选择测试地点"></div>
          <button type="button" id="test-speed" hidden>切换试骑限速</button>
        </details>
        <div id="keys" class="keys">W/S 油门刹车　A/D 转向　拖动转视角　E 互动</div>
        <div class="street-tools"><button id="map-open" type="button" aria-haspopup="dialog" aria-controls="street-map"><kbd>M</kbd>地图</button>
        <button id="look" type="button" aria-pressed="false"><kbd>V</kbd><span>近看阿柴</span></button></div>
        <span id="directions" hidden></span>
        <span class="photo-hint">拖动 360° 转视角 · 双击回正</span>
        <div id="joystick" role="group" aria-label="移动摇杆" aria-disabled="false">
          <span class="stick-guides" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="stick-thumb" aria-hidden="true"></span>
        </div>
        <div class="interaction">
          <aside id="dialogue" hidden aria-live="polite"><strong id="speaker"></strong><p id="line"></p></aside>
          <aside id="bun-dialogue" hidden></aside>
          <button id="action" type="button"><kbd>E</kbd><span id="action-text"></span></button>
        </div>
      </div>
      <div id="phone-shade" aria-hidden="true" hidden></div>
      <div id="phone" role="region" aria-label="骑手手机" data-expanded="false">
        <button id="phone-toggle" type="button" aria-expanded="false" aria-controls="phone-details"
                aria-label="展开骑手手机" aria-describedby="clock order-kind phase goal order-summary">
          <span class="phone-status"><span class="receiver" aria-hidden="true"></span><span id="order-kind">附近来单</span>
            <time id="clock">07:12</time><span id="phase">待接单</span><i class="battery" aria-hidden="true"></i></span>
          <span class="phone-task">
            <span class="task-heading"><strong id="goal">便民药店</strong><i class="fold-arrow" aria-hidden="true"></i></span>
            <span class="phone-guidance"><span id="order-summary">送往榕树里 3 号</span><span id="place">榕湾老街</span></span>
          </span>
        </button>
        <div id="phone-details" aria-hidden="true" inert>
          <div class="phone-scroll">
            <section id="order-screen" aria-label="订单明细">
              <div class="order-pay"><span><span class="service-name">阿柴快送 · </span>配送费</span><strong id="order-fee">¥3.10</strong></div>
              <button type="button" id="switch-order">换成包子单</button>
              <ol class="stops">
                <li><i>取</i><div><strong id="pickup-store">便民药店</strong><small id="pickup-person">榕湾老街 · 找兔药师</small></div></li>
                <li><i>送</i><div><strong id="delivery-address">榕树里 3 号</strong><small id="delivery-person">猫婆婆在楼下等</small></div></li>
              </ol>
              <p id="order-note" class="note">备注　药袋请当面交给猫婆婆。</p>
            </section>
            <section id="ride-info" hidden>
              <h2>榕湾村道</h2><p>沿老街往东，在城市十字路口转进横街，或直行经稻田和石桥到村口。</p>
              <p id="ride-distance"></p>
            </section>
            <section id="receipt" aria-label="本单账单" hidden>
              <h2>本单账单</h2>
              <dl><div><dt>配送费</dt><dd id="receipt-fee">+ ¥3.10</dd></div><div><dt>今日首单保险</dt><dd id="receipt-insurance">− ¥3.00</dd></div>
                <div class="net"><dt>实际到手</dt><dd id="receipt-net">¥0.10</dd></div></dl>
              <p id="receipt-note" class="note">“开张了，一毛也是热乎的。”</p>
              <p id="shift-summary" class="shift-summary" hidden></p>
            </section>
            <button id="ride-sound" type="button" aria-pressed="true" style="width:100%;margin:8px 0 4px;padding:6px 12px;font-size:13px">声音已开启</button>
          </div>
          <footer class="phone-footer">
            <button id="phone-main" type="button">接下第一单</button>
            <button id="next-order" type="button" hidden>继续接下一单</button>
            <button id="replay" type="button" hidden>再跑一趟 ↻</button>
            <span class="home-line" aria-hidden="true"></span>
          </footer>
        </div>
      </div>
    </div>
    <dialog id="street-map" aria-labelledby="map-title">
      <header><h2 id="map-title">榕湾老街</h2><button type="button" id="map-close" aria-label="关闭地图">关闭 ×</button></header>
      <canvas id="street-plan" aria-label="老街平面图，显示阿柴与取送点"></canvas>
      <footer><div class="map-stops" id="map-stops"><span><b>取</b><strong id="map-pickup"></strong></span><span><b>送</b><strong id="map-delivery">榕树里 3 号</strong></span></div><p id="map-location"></p></footer>
    </dialog>
    <div id="loading" role="status" aria-live="polite">
      <div class="loading-card">
        <div class="loading-badge" aria-hidden="true">🛵</div>
        <strong class="loading-title">阿柴快送</strong>
        <p id="loading-text">正在打开榕湾街区…</p>
        <div class="loading-bar" aria-hidden="true"><i id="loading-fill"></i></div>
      </div>
    </div>
    <p id="announcement" class="sr" aria-live="polite"></p>
    <noscript>请开启 JavaScript 后试玩。</noscript>
  </main>
  <script type="module" src="./src/morning/main.js"></script>
</body>
</html>
