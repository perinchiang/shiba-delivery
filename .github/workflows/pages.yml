name: Publish game to GitHub Pages

on:
  push:
    branches: [shiba-delivery-update]

permissions:
  contents: read

concurrency:
  group: shiba-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Preserve the published comparison URLs
        uses: actions/checkout@v7
        with:
          ref: 94dd15eaed33998ce71ee9bca8964dfb0f155c08
          path: previous-site
      - name: Populate the existing Monkey preview and its archives
        run: |
          cp -R previous-site/monkey dist/monkey
          cp dist/index.html dist/monkey/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v5
