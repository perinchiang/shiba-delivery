name: Publish Visual Progress Report to GitHub Pages

on:
  push:
    branches: [shiba-delivery-update]

permissions:
  contents: read

concurrency:
  group: shiba-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static HTML visual report portal
        run: python3 tools/build_report_site.py --out dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v5
